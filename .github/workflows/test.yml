name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'
      - run: pytest
      - name: Run the example offline
        run: |
          cd examples
          datadog-structurizr --service checkout-web --env prod --offline -o checkout-web --no-render
          test -s checkout-web/workspace.dsl
          ls checkout-web/*.mmd
