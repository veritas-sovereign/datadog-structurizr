name: publish-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: datadog-structurizr:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the example offline inside the image
        run: |
          out="$RUNNER_TEMP/c4"
          cp -r examples/checkout-web "$out"
          test "$(docker run --rm --entrypoint id datadog-structurizr:test -u)" = 10001
          docker run --rm --user "$(id -u):$(id -g)" -v "$out:/work" \
            datadog-structurizr:test -c c4.toml --offline -o . --no-render
          for f in workspace.dsl datadog-model.dsl datadog-views.dsl L1-Containers.mmd; do
            test -s "$out/$f" || { echo "missing or empty: $f"; exit 1; }
          done
      - name: The image version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$(docker run --rm datadog-structurizr:test --version)" = "datadog-structurizr ${GITHUB_REF_NAME#v}"

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
